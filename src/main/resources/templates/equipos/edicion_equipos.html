<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC | Editar Equipo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos Internos -->
    <style>
        /* Definición de la paleta de colores Azules */
        :root {
            --azul-oscuro: #0B2447;
            --azul-principal: #19376D;
            --azul-claro: #576CBC;
            --azul-header: linear-gradient(135deg, #0B2447, #19376D);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--azul-oscuro), var(--azul-principal), var(--azul-claro));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            width: 100%;
            max-width: 1100px;
        }

        /* Tarjeta Principal */
        .card-system {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, .25);
            background: #FFFFFF;
        }

        /* Cabecera de la Tarjeta */
        .card-header-system {
            background: var(--azul-header);
            text-align: center;
            padding: 30px 20px;
            color: white;
            border-bottom: 4px solid var(--azul-claro);
        }

        .logo-system {
            font-size: 50px;
            color: #FFFFFF;
            margin-bottom: 10px;
        }

        /* Secciones Internas / Dashboard Cards */
        .dashboard-card {
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 18px;
            transition: all 0.35s ease;
            background: #FFFFFF;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .03);
            height: 100%;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(25, 55, 109, .15);
            border-color: var(--azul-claro);
        }

        .section-title {
            color: var(--azul-oscuro);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icono {
            font-size: 1.6rem;
            color: var(--azul-claro);
        }

        /* Campos de Formulario */
        .form-label {
            font-weight: 600;
            color: #495057;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .form-control,
        .form-select {
            height: 48px;
            border-radius: 10px;
            border: 1px solid #ced4da;
            padding: 0.375rem 0.75rem;
            transition: all 0.3s ease;
        }

        textarea.form-control {
            height: auto;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--azul-claro);
            box-shadow: 0 0 0 4px rgba(87, 108, 188, .2);
            outline: none;
        }

        /* Botones */
        .btn-system {
            height: 50px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            padding: 0 25px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary-system {
            background-color: var(--azul-principal);
            border: none;
            color: white;
        }

        .btn-primary-system:hover {
            background-color: var(--azul-oscuro);
            color: white;
            transform: translateY(-2px);
        }
        
        /* Alerta personalizada para el modo edición */
        .alert-edit-mode {
            background-color: rgba(87, 108, 188, 0.1);
            border: 1px solid var(--azul-claro);
            color: var(--azul-oscuro);
            border-radius: 12px;
            font-weight: 500;
        }

        /* Footer */
        .card-footer-system {
            background: #F8F9FA;
            border-top: 1px solid #E9ECEF;
            text-align: center;
            padding: 25px;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="main-container">

        <!-- Contenedor Estilo Card System -->
        <div class="card card-system">

            <!-- Cabecera Principal -->
            <div class="card-header-system">
                <i class="bi bi-pencil-square logo-system"></i>
                <h2 class="fw-bold mb-1">Edición de Equipos</h2>
                <h5 class="text-light opacity-75 mb-1">Mercado DCC</h5>
                <p class="small mb-0 opacity-75">Busque y actualice la información de los activos tecnológicos.</p>
            </div>

            <!-- Cuerpo del Formulario -->
            <div class="card-body p-4 p-md-5">

                <!-- MODULO DE BÚSQUEDA Y FILTRADO (NUEVO) -->
                <div class="row mb-5">
                    <div class="col-12">
                        <div class="card dashboard-card" style="border-left: 5px solid var(--azul-claro);">
                            <div class="card-body p-4">
                                <h4 class="section-title mb-3">
                                    <i class="bi bi-search icono"></i>
                                    Buscar Equipo
                                </h4>
                                
                                <div class="row g-3">
                                    <div class="col-md-3">
                                        <label class="form-label text-muted small">Filtrar por</label>
                                        <select class="form-select">

                                            <option value="serial" selected>Serial del Equipo</option> <!--NO EDITABLE -->
                                            <option value="nombre">Nombre (Ej: CO-DCC...)</option>     <!--NO EDITABLE -->
                                            <option value="modelo">Modelo</option>
                                            <option value="mercado">Mercado</option>
                                        </select>
                                    </div>
                                    <div class="col-md-7">
                                        <label class="form-label text-muted small">Término de búsqueda</label>
                                        <input type="text" class="form-control" placeholder="Ej: ABC123XYZ456...">
                                    </div>
                                    <div class="col-md-2 d-flex align-items-end">
                                        <button class="btn btn-system btn-primary-system w-100">
                                            Buscar
                                        </button>
                                    </div>
                                </div>

                                <!-- Indicador de Equipo Seleccionado (Datos ficticios visuales) -->
                                <div class="alert alert-edit-mode mt-4 mb-0 d-flex align-items-center" role="alert">
                                    <i class="bi bi-info-circle-fill fs-4 me-3 text-primary"></i>
                                    <div>
                                        Se encontraron los datos para: 
                                        <strong>CO-DCC-LT-001</strong> | Serial: <span class="text-decoration-underline">ABC123XYZ456</span>. 
                                        <br><small class="text-muted">Modifique los campos necesarios a continuación.</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- FIN MODULO DE BÚSQUEDA -->

                <!-- FILA 1 -->
                <div class="row g-4 mb-4">

                    <!-- Identificación -->
                    <div class="col-lg-6">
                        <div class="card dashboard-card">
                            <div class="card-body p-4">
                                <h4 class="section-title mb-4">
                                    <i class="bi bi-upc-scan icono"></i>
                                    Identificación
                                </h4>

                                <div class="mb-3">
                                    <label class="form-label">Serial</label>
                                    <input type="text" class="form-control bg-light" value="ABC123XYZ456" readonly title="El serial no se puede modificar por seguridad">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Placa Inventario</label>
                                    <input type="text" class="form-control" value="INV001">
                                </div>

                                <div>
                                    <label class="form-label">Nombre Equipo</label>
                                    <input type="text" class="form-control" value="CO-DCC-LT-001">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Información Técnica -->
                    <div class="col-lg-6">
                        <div class="card dashboard-card">
                            <div class="card-body p-4">
                                <h4 class="section-title mb-4">
                                    <i class="bi bi-cpu-fill icono"></i>
                                    Información Técnica
                                </h4>

                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Tipo Equipo</label>
                                        <input type="text" class="form-control" value="Laptop">
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Marca</label>
                                        <input type="text" class="form-control" value="Dell">
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Modelo</label>
                                        <input type="text" class="form-control" value="Latitude 5440">
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Procesador</label>
                                        <input type="text" class="form-control" value="Intel Core i5">
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">RAM</label>
                                        <input type="text" class="form-control" value="16 GB">
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Disco</label>
                                        <input type="text" class="form-control" value="512 SSD">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- FILA 2 -->
                <div class="row g-4 mb-4">

                    <!-- Ubicación -->
                    <div class="col-lg-6">
                        <div class="card dashboard-card">
                            <div class="card-body p-4">
                                <h4 class="section-title mb-4">
                                    <i class="bi bi-geo-alt-fill icono"></i>
                                    Ubicación
                                </h4>

                                <div class="mb-3">
                                    <label class="form-label">Región</label>
                                    <input type="text" class="form-control" value="Colombia">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Mercado</label>
                                    <input type="text" class="form-control" value="DCC">
                                </div>

                                <div>
                                    <label class="form-label">Ciudad</label>
                                    <input type="text" class="form-control" value="Bogotá">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!--  Garantía -->
                    <div class="col-lg-6">
                        <div class="card dashboard-card">
                            <div class="card-body p-4">
                                <h4 class="section-title mb-4">
                                    <i class="bi bi-shield-check icono"></i>
                                    Garantía
                                </h4>

                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Proveedor</label>
                                        <input type="text" class="form-control" value="Dell Colombia">
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Factura</label>
                                        <input type="text" class="form-control" value="FAC-2026-001">
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Fecha Compra</label>
                                        <input type="date" class="form-control" value="2026-01-15">
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Fecha Fin Garantía</label>
                                        <input type="date" class="form-control" value="2029-01-15">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- FILA 3 -->
                <div class="row g-4">

                    <!-- Accesorios -->

                    <!-- Estado del Equipo -->
                    <!--<div class="col-lg-6">
                        <div class="card dashboard-card">

                                    <i class="bi bi-clipboard-check-fill icono"></i>
                                    Estado del Equipo
                                </h4>

                                <div class="mb-3">

                </div>

            </div>

            <!-- Footer / Botones -->
            <div class="card-footer-system">
                <div class="d-flex flex-wrap justify-content-center gap-2">
                    <button type="submit" class="btn btn-system btn-primary-system">
                        <i class="bi bi-arrow-clockwise"></i> Actualizar Cambios
                    </button>

                    <button type="button" class="btn btn-system btn-secondary">
                        <i class="bi bi-arrow-counterclockwise"></i> Deshacer

                    <a href="/dashboard/dashboard.html" class="btn btn-system btn-outline-secondary">

        </div>

    </div>
