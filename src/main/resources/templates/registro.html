<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso al Sistema</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!--CSS-->
    <link rel="stylesheet" href="estilos.css">

</head>

<body>

<div class="card card-system">

    <div class="card-header-system">

        <i class="bi bi-person-circle logo-system"></i>

        <h2 class="fw-bold mt-3">
            Sistema de Inventario
        </h2>

        <p class="mb-0">
            Control y Administración de Equipos
        </p>

    </div>

    <div class="card-body p-4">

        <!-- Flask -->
        <form action="/mercado" method="GET">

            <div class="mb-3">

                <label class="form-label fw-semibold">

                    <i class="bi bi-person-fill text-primary"></i>

                    Usuario

                </label>

                <input
                    type="text"
                    class="form-control"
                    name="usuario"
                    placeholder="Ingrese su usuario"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label fw-semibold">

                    <i class="bi bi-lock-fill text-primary"></i>

                    Contraseña

                </label>

                <input
                    type="password"
                    class="form-control"
                    name="password"
                    placeholder="Ingrese su contraseña"
                    required>

            </div>

            <div class="d-grid">

                <button class="btn btn-primary btn-system">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Ingresar

                </button>

            </div>

        </form>

    </div>

    <div class="card-footer text-center">

        <a href="#" class="text-decoration-none">
            ¿Olvidó su contraseña?
        </a>

        <hr>

        <small class="text-muted">
            Sistema de Inventario y Control de Equipos © 2026
        </small>

    </div>

</div>

</body>
</html>
