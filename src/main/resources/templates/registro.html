<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso al Sistema</title>

    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- ESTILOS SOBRIOS INTEGRADOS -->
    <style>
        /* ==============================
           VARIABLES GENERALES
        ============================== */
        :root {
            --azul-principal: #0F172A;
            --azul-acento: #2563EB;
            --azul-hover: #1D4ED8;
            --fondo-sitio: #F8FAFC;
            --fondo-tarjeta: #FFFFFF;
            --texto-principal: #0F172A;
            --texto-secundario: #64748B;
            --borde-suave: #E2E8F0;
            --sombra-elegante: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        }

        /* ==============================
           ESTILOS GENERALES Y RESETS
        ============================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--fondo-sitio);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--texto-principal);
        }

        /* ==============================
           TARJETA
        ============================== */
        .card-system {
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--borde-suave) !important;
            border-radius: 16px !important;
            overflow: hidden;
            background: var(--fondo-tarjeta) !important;
            box-shadow: var(--sombra-elegante);
        }

        /* ==============================
           CABECERA
        ============================== */
        .card-header-system {
            background: linear-gradient(180deg, #0F172A 0%, #1E293B 100%);
            color: #FFFFFF;
            text-align: center;
            padding: 35px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card-header-system h2 {
            font-size: 1.5rem;
            letter-spacing: -0.5px;
        }

        .card-header-system p {
            color: #94A3B8;
            font-size: 0.9rem;
        }

        .logo-system {
            font-size: 52px;
            color: #F8FAFC;
            margin-bottom: 8px;
        }

        /* ==============================
           CUERPO Y FORMULARIO
        ============================== */
        .card-body {
            background: var(--fondo-tarjeta);
            padding: 30px;
        }

        .form-label {
            font-size: 0.875rem;
            color: var(--texto-principal);
        }

        .form-label i {
            color: var(--azul-acento);
        }

        .form-control {
            height: 48px;
            border-radius: 8px;
            border: 1px solid var(--borde-suave);
            padding: 0 16px;
            font-size: 15px;
            color: var(--texto-principal);
            background-color: #F8FAFC;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background-color: #FFFFFF;
            border-color: var(--azul-acento);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
            outline: none;
        }

        /* ==============================
           BOTÓN
        ============================== */
        .btn-system {
            height: 48px;
            border-radius: 8px;
            border: none;
            background: var(--azul-acento) !important;
            color: #FFFFFF !important;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-system:hover {
            background: var(--azul-hover) !important;
        }

        .btn-system:active {
            transform: scale(0.99);
        }

        /* ==============================
           FOOTER Y ENLACES
        ============================== */
        .card-footer {
            background: #F1F5F9;
            text-align: center;
            padding: 18px 20px;
            border-top: 1px solid var(--borde-suave);
            font-size: 14px;
            color: var(--texto-secundario);
        }

        .card-footer hr {
            border-color: var(--borde-suave);
            margin: 15px 0;
            opacity: 0.6;
        }

        .card-footer small {
            color: var(--texto-secundario);
            font-size: 0.775rem;
        }

        a {
            text-decoration: none;
            color: var(--azul-acento);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--azul-hover);
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="card card-system">

    <!-- CABECERA -->
    <div class="card-header-system">
        <i class="bi bi-person-circle logo-system"></i>

        <h2 class="fw-bold mt-2 mb-1">
            Sistema de Inventario
        </h2>

        <p class="mb-0">
            Control y Administración de Equipos
        </p>
    </div>

    <!-- CUERPO -->
    <div class="card-body p-4">

        <form action="/mercado" method="GET">

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    <i class="bi bi-person-fill me-1"></i>
                    Usuario
                </label>
                <input
                    type="text"
                    class="form-control"
                    name="usuario"
                    placeholder="Ingrese su usuario"
                    required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">
                    <i class="bi bi-lock-fill me-1"></i>
                    Contraseña
                </label>
                <input
                    type="password"
                    class="form-control"
                    name="password"
                    placeholder="Ingrese su contraseña"
                    required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn-system d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Ingresar
                </button>
            </div>

        </form>

    </div>

    <!-- PIE DE PÁGINA -->
    <div class="card-footer text-center">
        <div class="mb-2">
            <a href="#">¿Olvidó su contraseña?</a>
        </div>

        <hr>

        <small>
            Sistema de Inventario y Control de Equipos © 2026
        </small>
    </div>

</div>

</body>
</html>
