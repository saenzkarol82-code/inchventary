<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Región y Mercado</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS-->
     <link rel="stylesheet" href="estilos.css">

    
</head>

<body>

<div class="card card-system">

    <div class="card-header-system">

        <i class="bi bi-globe-americas logo-icon"></i>

        <h2 class="mt-3 fw-bold">
            Sistema de Gestión
        </h2>

        <p class="mb-0">
            Seleccione la región y el mercado de trabajo
        </p>

    </div>

    <div class="card-body p-4">

        <form action="/dashboard" method="POST">

            <!-- Región -->
            <div class="mb-4">

                <label class="form-label fw-semibold">
                    <i class="bi bi-geo-alt-fill text-primary"></i>
                    Región / País
                </label>

                <select class="form-select" name="region" required>

                    <option selected disabled>
                        Seleccione una región...
                    </option>

                    <option value="Argentina">Argentina</option>
                    <option value="Bolivia">Bolivia</option>
                    <option value="Brasil">Brasil</option>
                    <option value="Chile">Chile</option>
                    <option value="Colombia">Colombia</option>
                    <option value="Costa Rica">Costa Rica</option>
                    <option value="Ecuador">Ecuador</option>
                    <option value="Guatemala">Guatemala</option>
                    <option value="México">México</option>
                    <option value="Panamá">Panamá</option>
                    <option value="Paraguay">Paraguay</option>
                    <option value="Perú">Perú</option>
                    <option value="República Dominicana">República Dominicana</option>
                    <option value="Uruguay">Uruguay</option>

                </select>

            </div>

            <!-- Mercado -->
            <div class="mb-4">

                <label class="form-label fw-semibold">
                    <i class="bi bi-building-fill text-primary"></i>
                    Mercado
                </label>

                <select class="form-select" name="mercado" required>

                    <option selected disabled>
                        Seleccione un mercado...
                    </option>

                    <option value="DCC">DCC</option>
                    <option value="DERCO">DERCO</option>
                    <option value="PRACO">PRACO</option>
                    <option value="SUBARU">SUBARU</option>

                </select>

            </div>

            <div class="d-grid gap-2">

                <button type="submit" class="btn btn-primary btn-system">

                    <i class="bi bi-arrow-right-circle-fill"></i>
                    Continuar

                </button>

                <button type="reset" class="btn btn-outline-secondary btn-system">

                    <i class="bi bi-arrow-counterclockwise"></i>
                    Limpiar

                </button>

            </div>

        </form>

    </div>

    <div class="card-footer text-center bg-light">

        <small class="text-muted">
            Sistema de Inventario y Control de Equipos © 2026
        </small>

    </div>

</div>

</body>
</html>
